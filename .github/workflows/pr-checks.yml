# Runs the repository checks on every pull request and on pushes to main.
# The repository is private on GitHub Free, so branch protection cannot require this check:
# VERIFICATION.md asks for a green run on the PR head before merging.
name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      # Install scripts are skipped: no unit test loads onnxruntime-node, and typecheck/vitest need no
      # postinstall step.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
