<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시안 B 악보대형 (가로)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#777}
body{padding:0}
.screen{background:var(--bg);color:var(--ink);overflow:hidden;position:relative;font:20px/1.3 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.portrait{width:390px;height:844px}
.landscape{width:844px;height:390px}
.chord{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:.9}
.dia{display:block;color:var(--ink);overflow:visible}
.dia .d-str{stroke:currentColor;opacity:.7}
.dia .d-fret{stroke:currentColor;opacity:.45;stroke-width:1.2}
.dia .d-nut{fill:currentColor}
.dia .d-dot{fill:currentColor}
.dia .d-num{fill:var(--surface);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
.dia .d-open{fill:none;stroke:currentColor;stroke-width:1.8}
.dia .d-x{stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.dia .d-fr{fill:currentColor;font:600 9px system-ui,sans-serif}
.capo{font-weight:800;font-size:22px;color:var(--accent)}
.sec{font-weight:700;font-size:22px}
.status{font-size:18px;font-weight:600;color:var(--ink-2)}

.screen{--bg:#F3EFE7;--surface:#F3EFE7;--ink:#1D1A15;--ink-2:#4A443B;--line:#CFC6B6;--accent:#B13E12;--accent-ink:#FFF7EF;color-scheme:light}

.b{display:grid}
.b .top{display:flex;justify-content:space-between;align-items:baseline}
.b .half{display:flex;align-items:center;gap:18px}
.b .now .chord{font-size:140px}
.b .nx .chord{font-size:92px}
.b .lbl{font-size:22px;font-weight:700;color:var(--ink-2)}
.b .dots{display:flex;gap:12px;margin-top:10px}
.b .dots i{width:30px;height:30px;border-radius:50%;border:3px solid var(--accent);display:block}
.b .dots i.on{background:var(--accent)}
.b .cnt{font-size:24px;font-weight:800;margin-top:8px}
.b.portrait{grid-template-rows:auto 1fr auto 1fr auto;padding:56px 24px 28px}
.b.portrait .now{justify-content:space-between}
.b.portrait .rule{border-top:3px solid var(--line);margin:4px 0 0}
.b.portrait .nx{justify-content:space-between}
.b.landscape{grid-template-columns:1.35fr 1fr;grid-template-rows:auto 1fr auto;column-gap:28px;padding:24px 56px 18px}
.b.landscape .top{grid-column:1/-1}
.b.landscape .nx{flex-direction:column;align-items:flex-start;border-left:3px solid var(--line);padding-left:28px;justify-content:center}
.b.landscape .nx .row{display:flex;align-items:center;gap:16px}
.b.landscape .status{grid-column:1/-1}

</style>
</head>
<body>
<div class="screen b landscape">

<div class="top"><span class="capo">카포 2 모양</span><span class="sec">2절 · 9마디</span></div>
<section class="half now" aria-label="지금 코드"><div class="chord">G</div><svg class="dia" viewBox="0 0 100 128" width="165" height="211" role="img" aria-label="G 운지 3 2 0 0 0 3"><line class="d-fret" x1="16" x2="84" y1="26" y2="26"/><line class="d-fret" x1="16" x2="84" y1="50" y2="50"/><line class="d-fret" x1="16" x2="84" y1="74" y2="74"/><line class="d-fret" x1="16" x2="84" y1="98" y2="98"/><line class="d-fret" x1="16" x2="84" y1="122" y2="122"/><line class="d-str" x1="16" x2="16" y1="26" y2="122" stroke-width="1.90"/><line class="d-str" x1="29.6" x2="29.6" y1="26" y2="122" stroke-width="1.72"/><line class="d-str" x1="43.2" x2="43.2" y1="26" y2="122" stroke-width="1.54"/><line class="d-str" x1="56.8" x2="56.8" y1="26" y2="122" stroke-width="1.36"/><line class="d-str" x1="70.4" x2="70.4" y1="26" y2="122" stroke-width="1.18"/><line class="d-str" x1="84" x2="84" y1="26" y2="122" stroke-width="1.00"/><rect class="d-nut" x="14.5" y="22" width="71" height="5" rx="1.2"/><circle class="d-dot" cx="16" cy="86" r="5.44"/><text class="d-num" x="16" y="86.5">2</text><circle class="d-dot" cx="29.6" cy="62" r="5.44"/><text class="d-num" x="29.6" y="62.5">1</text><circle class="d-open" cx="43.2" cy="13" r="4.2"/><circle class="d-open" cx="56.8" cy="13" r="4.2"/><circle class="d-open" cx="70.4" cy="13" r="4.2"/><circle class="d-dot" cx="84" cy="86" r="5.44"/><text class="d-num" x="84" y="86.5">3</text></svg></section>
<section class="half nx" aria-label="다음 코드"><div class="row"><div>
    <div class="lbl">다음</div>
    <div class="chord">C</div>
    <div class="dots" aria-label="바뀌기까지 3박"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
    <div class="cnt">3박 뒤에 바뀜</div>
  </div>
  <svg class="dia" viewBox="0 0 100 128" width="124" height="159" role="img" aria-label="C 운지 x 3 2 0 1 0"><line class="d-fret" x1="16" x2="84" y1="26" y2="26"/><line class="d-fret" x1="16" x2="84" y1="50" y2="50"/><line class="d-fret" x1="16" x2="84" y1="74" y2="74"/><line class="d-fret" x1="16" x2="84" y1="98" y2="98"/><line class="d-fret" x1="16" x2="84" y1="122" y2="122"/><line class="d-str" x1="16" x2="16" y1="26" y2="122" stroke-width="1.90"/><line class="d-str" x1="29.6" x2="29.6" y1="26" y2="122" stroke-width="1.72"/><line class="d-str" x1="43.2" x2="43.2" y1="26" y2="122" stroke-width="1.54"/><line class="d-str" x1="56.8" x2="56.8" y1="26" y2="122" stroke-width="1.36"/><line class="d-str" x1="70.4" x2="70.4" y1="26" y2="122" stroke-width="1.18"/><line class="d-str" x1="84" x2="84" y1="26" y2="122" stroke-width="1.00"/><rect class="d-nut" x="14.5" y="22" width="71" height="5" rx="1.2"/><path class="d-x" d="M12 9l8 8M20 9l-8 8"/><circle class="d-dot" cx="29.6" cy="86" r="5.44"/><text class="d-num" x="29.6" y="86.5">3</text><circle class="d-dot" cx="43.2" cy="62" r="5.44"/><text class="d-num" x="43.2" y="62.5">2</text><circle class="d-open" cx="56.8" cy="13" r="4.2"/><circle class="d-dot" cx="70.4" cy="38" r="5.44"/><text class="d-num" x="70.4" y="38.5">1</text><circle class="d-open" cx="84" cy="13" r="4.2"/></svg></div></section>
<div class="status">Mac과 연결됨</div>

</div>
</body>
</html>
