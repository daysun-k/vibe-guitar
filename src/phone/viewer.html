<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<title>Vibe Guitar 악보대</title>
<style>
  :root{--bg:#F3EFE7;--ink:#1D1A15;--ink-2:#4A443B;--line:#CFC6B6;--accent:#B13E12;color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:20px/1.3 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
  body{overflow:hidden}
  .stand{height:100%;display:grid;grid-template-rows:auto 1fr auto 1fr auto;column-gap:28px;padding:max(24px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;min-height:1.3em}
  .capo{font-weight:800;font-size:24px;color:var(--accent)}
  .where{font-weight:700;font-size:24px;text-align:right;font-variant-numeric:tabular-nums}
  .chord{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:.95;white-space:nowrap}
  .snd{font-size:22px;font-weight:700;color:var(--ink-2);margin-top:6px}
  .snd:empty{display:none}
  .now,.nx{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:0}
  .now .chord{font-size:min(34vw,16vh)}
  .nx .chord{font-size:min(22vw,10vh)}
  #now-dia svg{width:min(42vw,25vh);height:auto}
  #next-dia svg{width:min(32vw,19vh);height:auto}
  .rule{border-top:3px solid var(--line)}
  .lbl{font-size:24px;font-weight:700;color:var(--ink-2)}
  .dots{display:flex;gap:12px;margin-top:12px}
  .dots:empty{display:none}
  .dots i{width:30px;height:30px;border-radius:50%;border:3px solid var(--accent);display:block}
  .dots i.on{background:var(--accent)}
  .cnt{font-size:26px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums}
  .foot{display:flex;flex-direction:column;gap:10px}
  .status{font-size:20px;font-weight:600;color:var(--ink-2)}
  .status.alert{color:var(--accent);font-weight:800}
  .lock{margin:0;font-size:20px;line-height:1.4;border:3px solid var(--accent);padding:12px 14px;display:flex;gap:14px;align-items:center;justify-content:space-between}
  .lock[hidden]{display:none}
  .lock button{font:inherit;font-weight:800;color:#FFF7EF;background:var(--accent);border:0;border-radius:6px;padding:10px 16px;flex:none}
  .nodia{font-size:22px;font-weight:700;color:var(--ink-2)}
  .pair{margin:0;font-size:20px;line-height:1.35;border:3px dashed var(--line);padding:10px 14px;display:flex;gap:14px;align-items:center;justify-content:space-between}
  .pair[hidden]{display:none}
  .pair b{font-size:40px;font-weight:800;letter-spacing:.18em;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
  .ctl{display:flex;gap:14px}
  .ctl[hidden]{display:none}
  .ctl button{flex:1;font:inherit;font-size:26px;font-weight:800;min-height:72px;border-radius:12px;border:3px solid var(--accent);background:var(--accent);color:#FFF7EF;touch-action:manipulation}
  .ctl button.sec{background:transparent;color:var(--accent)}
  .ctl button:disabled{opacity:.45}
  .ctl-msg{margin:0;font-size:20px;font-weight:700;color:var(--ink-2)}
  .ctl-msg:empty{display:none}
  .ctl-msg.alert{color:var(--accent)}
  .wait{grid-row:2/5;align-self:center;font-size:30px;font-weight:800;line-height:1.35}
  .wait small{display:block;font-size:22px;font-weight:600;color:var(--ink-2);margin-top:8px}
  .stand.waiting .now,.stand.waiting .rule,.stand.waiting .nx{display:none}
  .stand:not(.waiting) .wait{display:none}
  .stand.stale .now,.stand.stale .nx{opacity:.35}
  .dia{display:block;color:var(--ink)}
  .dia svg{display:block;overflow:visible}
  .dia .d-str{stroke:currentColor;opacity:.7}
  .dia .d-fret{stroke:currentColor;opacity:.45;stroke-width:1.2}
  .dia .d-nut,.dia .d-dot{fill:currentColor}
  .dia .d-num{fill:var(--bg);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
  .dia .d-open{fill:none;stroke:currentColor;stroke-width:1.8}
  .dia .d-x{stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
  .dia .d-fr{fill:currentColor;font:700 10px system-ui,sans-serif}
  @media (orientation:landscape){
    .stand{grid-template-columns:1.35fr 1fr;grid-template-rows:auto 1fr auto;padding-top:max(16px,env(safe-area-inset-top))}
    .top,.foot,.wait{grid-column:1/-1}
    .wait{grid-row:2}
    .rule{display:none}
    .now{justify-content:flex-start;gap:min(4vw,32px)}
    .nx{border-left:3px solid var(--line);padding-left:28px;justify-content:flex-start;gap:min(3vw,24px)}
    .now .chord{font-size:min(17vw,34vh)}
    .nx .chord{font-size:min(11vw,22vh)}
    #now-dia svg{width:auto;height:min(50vh,30vw)}
    #next-dia svg{width:auto;height:min(40vh,22vw)}
    .foot{flex-direction:row;align-items:center;justify-content:space-between;gap:20px}
    .lock{font-size:18px;padding:8px 12px;flex:1}
    .pair{font-size:18px;padding:6px 12px;flex:1}
    .pair b{font-size:30px}
    .ctl{flex:none}
    .ctl button{min-height:60px;font-size:22px;padding:0 22px}
    .status{flex:none;max-width:45%}
  }
</style>
</head>
<body>
<main id="app" class="stand waiting">
  <header class="top"><span id="capo" class="capo"></span><span id="where" class="where"></span></header>
  <p id="wait" class="wait">Mac에 연결하는 중<small>Mac 터미널에서 npm run phone이 켜져 있는지 확인해 주세요</small></p>
  <section class="now" aria-label="지금 코드">
    <div><div id="now-name" class="chord">–</div><div id="now-snd" class="snd"></div></div>
    <div id="now-dia" class="dia"></div>
  </section>
  <div class="rule" aria-hidden="true"></div>
  <section class="nx" aria-label="다음 코드">
    <div>
      <div class="lbl">다음</div>
      <div id="next-name" class="chord">–</div>
      <div id="next-snd" class="snd"></div>
      <div id="dots" class="dots" aria-hidden="true"></div>
      <div id="count" class="cnt"></div>
    </div>
    <div id="next-dia" class="dia"></div>
  </section>
  <footer class="foot">
    <p id="lock" class="lock" hidden><span>화면이 꺼지지 않게 자동 잠금을 꺼 주세요. iPhone: 설정 › 디스플레이 및 밝기 › 자동 잠금. Android: 설정 › 디스플레이 › 화면 자동 꺼짐.</span><button id="lock-ok" type="button">확인</button></p>
    <p id="pair" class="pair" hidden><span id="pair-text">조작하려면 Mac 패널 › 휴대폰에서 조작 허용에서 이 번호를 승인해 주세요</span><b id="pair-code"></b></p>
    <div id="ctl" class="ctl" hidden><button id="ctl-toggle" type="button">재생</button><button id="ctl-restart" class="sec" type="button">처음부터</button></div>
    <p id="ctl-msg" class="ctl-msg" aria-live="polite"></p>
    <div id="status" class="status" aria-live="polite">연결 중</div>
  </footer>
</main>
<script src="/viewer.js"></script>
</body>
</html>
